# cargo-about configuration: which dependencies' licences go into
# THIRD_PARTY_LICENSES.md and the list in the app. Regenerate with
# `python3 dev/third_party_licenses.py` after changing dependencies
# (CI checks that the committed files are current).

# The platforms OpenRAGE is released for.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Test-only dependencies are not part of the programs.
ignore-dev-dependencies = true
# OpenRAGE's own crates are covered by LICENSE (and crates/rage-tfit2/LICENSE).
private = { ignore = true }
# The generator runs `cargo about generate --frozen`: only the licence files in
# the crates themselves, no online lookups, so the result is the same everywhere.

accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "GPL-3.0-only",
]

# The TFIT2 cipher port (see NOTICE.md).
[rage-tfit2]
accepted = ["AGPL-3.0-only"]
