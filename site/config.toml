# Zola configuration of the OpenRAGE website.
# Content lives in content/ (Markdown), layout in templates/, CSS/JS in static/.
base_url = "https://two-play.github.io/openrage"
title = "OpenRAGE"
description = "The free, open-source successor to OpenIV: mod GTA V and explore Red Dead Redemption 2 on Linux and Windows."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false
generate_sitemap = true
generate_robots_txt = true

[markdown]
# `> [!NOTE]` / `> [!WARNING]` blocks work like on GitHub.
github_alerts = true
insert_anchor_links = "none"

[link_checker]
internal_level = "error"
# External sites can be flaky; report them without failing the check.
external_level = "warn"

[extra]
repo = "https://github.com/Two-Play/openrage"
releases = "https://github.com/Two-Play/openrage/releases"

# Documentation sidebar: groups of pages, in order.
[[extra.docs]]
title = "Start"
pages = [["getting-started.md", "Getting started"]]

[[extra.docs]]
title = "Using OpenRAGE"
pages = [
  ["guide.md", "Explorer and search"],
  ["viewers.md", "Viewing files"],
  ["modding.md", "Modding"],
  ["cli.md", "Command line"],
]

[[extra.docs]]
title = "Games"
pages = [["gta-iv.md", "GTA IV"], ["rdr2.md", "Red Dead Redemption 2"]]

[[extra.docs]]
title = "Develop"
pages = [
  ["plugins.md", "Writing plugins"],
  ["development.md", "Development"],
  ["licenses.md", "Licenses"],
]

