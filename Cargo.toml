[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Two-Play/openrage"
authors = ["OpenRAGE contributors"]

[workspace.dependencies]
rage-core = { path = "crates/rage-core" }
rage-crypto = { path = "crates/rage-crypto" }
rage-rpf = { path = "crates/rage-rpf" }
rage-index = { path = "crates/rage-index" }
rage-mods = { path = "crates/rage-mods" }
rage-resource = { path = "crates/rage-resource" }
rage-formats = { path = "crates/rage-formats" }

aes = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
flate2 = "1"
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
sha1 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"

# Crypto and inflate are hot loops; keep them fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3
