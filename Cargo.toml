[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Two-Play/openrage"
authors = ["OpenRAGE contributors"]

[workspace.dependencies]
rage-core = { path = "crates/rage-core" }
rage-crypto = { path = "crates/rage-crypto" }
rage-tfit2 = { path = "crates/rage-tfit2" }
rage-rpf = { path = "crates/rage-rpf" }
rage-index = { path = "crates/rage-index" }
rage-mods = { path = "crates/rage-mods" }
rage-resource = { path = "crates/rage-resource" }
rage-formats = { path = "crates/rage-formats" }

aes = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
flate2 = "1"
serde_json = "1"
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
sha1 = "0.10"
sha2 = "0.10"
memchr = "2"
oozextract = { version = "0.5", default-features = false }
thiserror = "2"

[profile.release]
lto = "thin"

# Crypto and inflate are hot loops; keep them fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3

# The plugin runtime (wasmtime and its Cranelift compiler) is large; compiled
# for size it costs far less download, and plugins are small and run rarely.
[profile.release.package.cranelift-codegen]
opt-level = "s"
[profile.release.package.cranelift-assembler-x64]
opt-level = "s"
[profile.release.package.regalloc2]
opt-level = "s"
[profile.release.package.wasmtime]
opt-level = "s"
[profile.release.package.wasmtime-environ]
opt-level = "s"
[profile.release.package.wasmtime-internal-cranelift]
opt-level = "s"
[profile.release.package.wasmparser]
opt-level = "s"
[profile.release.package.pulley-interpreter]
opt-level = "s"
[profile.release.package.wasmtime-wasi]
opt-level = "s"
[profile.release.package.wit-parser]
opt-level = "s"
[profile.release.package.wit-component]
opt-level = "s"
