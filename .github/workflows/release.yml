name: Release

# Pushing a tag such as v0.2.0 builds OpenRAGE for Linux (.tar.gz and
# AppImage) and Windows (.zip) and publishes a GitHub release with them and
# their SHA-256 checksums.
# "Run workflow" (manual) builds the same archives without publishing, to
# try a release first. Tests are not repeated here: CI runs them on every
# change to main, which is where release tags are cut from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported Ubuntu keeps the glibc requirement low.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi
      - name: Install system libraries for the GUI (Slint, audio output)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build
        run: cargo build --release --locked -p openrage-cli -p openrage-gui
      - name: Package
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          dir="openrage-${ref}-${{ matrix.name }}"
          mkdir -p "$dir" out
          cp README.md LICENSE NOTICE.md "$dir/"
          cp crates/rage-tfit2/LICENSE "$dir/LICENSE-AGPL-3.0"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/openrage.exe target/release/openrage-gui.exe "$dir/"
            7z a -tzip "out/$dir.zip" "$dir" > /dev/null
          else
            cp target/release/openrage target/release/openrage-gui "$dir/"
            cp packaging/openrage.desktop packaging/openrage.png "$dir/"
            tar czf "out/$dir.tar.gz" "$dir"
          fi
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          app=OpenRAGE.AppDir
          mkdir -p "$app/usr/bin" "$app/usr/share/applications" "$app/usr/share/icons/hicolor/256x256/apps" "$app/usr/share/doc/openrage"
          cp target/release/openrage target/release/openrage-gui "$app/usr/bin/"
          cp packaging/AppRun "$app/AppRun"
          chmod +x "$app/AppRun"
          cp packaging/openrage.desktop "$app/openrage.desktop"
          cp packaging/openrage.desktop "$app/usr/share/applications/"
          cp packaging/openrage.png "$app/openrage.png"
          cp packaging/openrage.png "$app/.DirIcon"
          cp packaging/openrage.png "$app/usr/share/icons/hicolor/256x256/apps/"
          cp README.md LICENSE NOTICE.md "$app/usr/share/doc/openrage/"
          cp crates/rage-tfit2/LICENSE "$app/usr/share/doc/openrage/LICENSE-AGPL-3.0"
          curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # No FUSE on the runners: let the tool unpack itself.
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream "$app" "out/openrage-${ref}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "OpenRAGE ${GITHUB_REF_NAME}" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
