name: Release

# Pushing a tag such as v0.2.0 builds OpenRAGE for Linux and Windows and
# publishes a GitHub release with the archives and their SHA-256 checksums.
# "Run workflow" (manual) builds the same archives without publishing, to
# try a release first. Tests are not repeated here: CI runs them on every
# change to main, which is where release tags are cut from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported Ubuntu keeps the glibc requirement low.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi
      - name: Install system libraries for the GUI (Slint, audio output)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build
        run: cargo build --release --locked -p openrage-cli -p openrage-gui
      - name: Package
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          dir="openrage-${ref}-${{ matrix.name }}"
          mkdir -p "$dir"
          cp README.md LICENSE NOTICE.md "$dir/"
          cp crates/rage-tfit2/LICENSE "$dir/LICENSE-AGPL-3.0"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/openrage.exe target/release/openrage-gui.exe "$dir/"
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            cp target/release/openrage target/release/openrage-gui "$dir/"
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "OpenRAGE ${GITHUB_REF_NAME}" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
