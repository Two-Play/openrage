name: CI

# Changes that only touch the website or documentation skip the Rust build;
# the website has its own checks (pages.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # No incremental artifacts and no debug info: faster builds, smaller caches.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries for the GUI (Slint, audio output)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libudev-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Caches compiled dependencies; runs on main fill the cache that PRs reuse.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      # Lints are the same on both systems; checking them once saves a full build on Windows.
      - run: cargo clippy --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo test

  # Every dependency must come under a GPL-3-compatible licence (deny.toml),
  # and the generated licence list (THIRD_PARTY_LICENSES.md and the data the
  # app shows) must match Cargo.lock.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.3
      - run: cargo deny check licenses
      - run: cargo fetch --locked
      - name: Check that the licence list is current
        run: python3 dev/third_party_licenses.py --check
