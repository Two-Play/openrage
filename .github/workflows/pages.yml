name: Website

# Builds the project website (site/, Zola) and checks it on every pull request
# that touches it; pushes to main also deploy it to GitHub Pages.
# The screenshots are not duplicated: they are copied from docs/images at build time,
# the licence data from crates/openrage-app/src.
# GitHub Pages must be enabled once: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "crates/openrage-app/src/third_party_licenses.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/images/**"
      - "crates/openrage-app/src/third_party_licenses.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZOLA_VERSION: "0.23.6"
  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"
  SITE_URL: "https://two-play.github.io/openrage"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          archive="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/$archive"
          echo "${ZOLA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Copy the screenshots
        run: mkdir -p site/static/images && cp docs/images/*.png site/static/images/
      - name: Copy the licence data (generated by dev/third_party_licenses.py)
        run: mkdir -p site/data && cp crates/openrage-app/src/third_party_licenses.json site/data/
      - name: Check content and links (zola check)
        working-directory: site
        run: zola check
      - name: Build
        working-directory: site
        run: zola build --base-url "$SITE_URL"
      - name: Check the built site (links, anchors, alt texts, titles)
        run: python3 site/check_site.py site/public "$SITE_URL"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
