[package]
name = "openrage-app"
description = "Application logic shared by the OpenRAGE CLI and GUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rage-core.workspace = true
rage-crypto.workspace = true
rage-rpf.workspace = true
rage-mods.workspace = true
rage-formats.workspace = true
rage-index.workspace = true
rage-resource.workspace = true
anyhow.workspace = true
memchr.workspace = true
dirs.workspace = true
rayon.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
openrage-plugins = { path = "../openrage-plugins" }
png = "0.18"
zip.workspace = true
sha2.workspace = true
# Downloads CodeWalker's key blob when the user asks for it: rustls with the
# system's certificates, no other TLS stack and no bundled root certificates.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "0.8"

[dev-dependencies]
flate2.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
