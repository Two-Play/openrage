[package]
name = "openrage-gui"
description = "OpenRAGE graphical explorer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openrage-gui"
path = "src/main.rs"

[dependencies]
openrage-app = { path = "../openrage-app" }
openrage-plugins = { path = "../openrage-plugins" }
rage-core.workspace = true
rage-crypto.workspace = true
rage-rpf.workspace = true
rage-index.workspace = true
rage-mods.workspace = true
rage-formats.workspace = true
rage-resource.workspace = true
anyhow.workspace = true
rayon.workspace = true
rfd = "0.15"
wgpu = "30"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
