# Plugins are built for WebAssembly, separately from OpenRAGE itself:
#
#   cargo build --manifest-path plugins/Cargo.toml --target wasm32-wasip2 --release
#
# The SDK and the examples are MIT OR Apache-2.0, so plugin authors can copy
# them into plugins under any licence.
[workspace]
resolver = "3"
members = ["sdk", "examples/*", "tests/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Two-Play/openrage"

[workspace.dependencies]
openrage-plugin-sdk = { path = "sdk" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
