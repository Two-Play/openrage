# Test plugin used by crates/openrage-plugins/tests; not shipped.
id = "probe"
name = "Probe"
version = "0.1.0"
api = "0.3"
license = "MIT OR Apache-2.0"
wasm = "probe.wasm"
permissions = ["read-game", "write-mods"]

[[preview]]
extensions = ["tree", "table", "image", "badimage", "badmodel", "probe"]

[[actions]]
id = "run"
title = "Run a probe"
kind = "tool"
extensions = ["*"]

[[actions]]
id = "modify"
title = "Change files"
kind = "modify"
extensions = ["*"]
batch = true
