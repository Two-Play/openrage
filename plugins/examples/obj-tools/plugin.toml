# OpenRAGE example plugin: 3D models in and out.
id = "obj-tools"
name = "OBJ tools"
version = "0.1.0"
api = "0.3"
description = "Shows Wavefront OBJ models in the 3D view, exports the game's models as OBJ with their textures (PNG) and replaces a model's meshes with an OBJ (GTA V Enhanced .ydr)."
authors = ["OpenRAGE contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Two-Play/openrage"
wasm = "obj_tools.wasm"
# Viewing and exporting read only the files you use them on; replacing a
# model writes the new one into the mods folder (undo in History).
permissions = ["write-mods"]

[[file-types]]
extensions = ["obj"]
name = "Wavefront model"
category = "model"

[[preview]]
extensions = ["obj"]

[[actions]]
id = "export"
title = "Export as OBJ…"
kind = "export"
extensions = ["ydr", "yft", "ydd", "wdr", "wdd", "wft"]
batch = true

[[actions]]
id = "replace"
title = "Replace with OBJ…"
kind = "modify"
extensions = ["ydr"]
# The OBJ, and optionally its .mtl and the PNG textures it names.
pick = ["obj", "mtl", "png"]
pick-title = "Choose the OBJ model (and its .mtl and PNG textures)"
