# OpenRAGE example plugin: 3D models in and out.
id = "obj-tools"
name = "OBJ tools"
version = "0.1.0"
api = "0.3"
description = "Shows Wavefront OBJ models in the 3D view and exports the game's models as OBJ with their textures (PNG)."
authors = ["OpenRAGE contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Two-Play/openrage"
wasm = "obj_tools.wasm"
# No permissions: it reads only the models you export with it.

[[file-types]]
extensions = ["obj"]
name = "Wavefront model"
category = "model"

[[preview]]
extensions = ["obj"]

[[actions]]
id = "export"
title = "Export as OBJ…"
kind = "export"
extensions = ["ydr", "yft", "ydd", "wdr", "wdd", "wft"]
batch = true
